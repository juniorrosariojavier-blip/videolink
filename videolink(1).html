<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VideoLink</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#0b1020;color:#f4f6ff;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(760px,100%)}header{text-align:center;margin-bottom:26px}.logo{font-size:clamp(2.5rem,8vw,4rem);font-weight:800;letter-spacing:-2px;color:#8ab4ff}header p{color:#aeb9d3}.panel{background:#151d33;border:1px solid #2c3958;border-radius:18px;padding:22px;box-shadow:0 18px 50px #0005}label{display:block;font-weight:650;margin-bottom:9px}input{width:100%;padding:15px;border-radius:10px;border:1px solid #465575;background:#0c1428;color:white;font-size:1rem}button{border:0;border-radius:10px;padding:12px 16px;background:#3978f6;color:white;font-weight:700;cursor:pointer;margin:10px 8px 0 0}button.secondary{background:#34415f}#status{color:#b9c8e8;min-height:24px;margin-top:12px}.viewer{margin-top:18px;aspect-ratio:16/9;background:#070b14;border-radius:12px;overflow:hidden;display:none}.viewer iframe,.viewer video{width:100%;height:100%;border:0}.note{font-size:.9rem;color:#aeb9d3;line-height:1.5;margin-top:18px}a{color:#9ec1ff}
</style></head>
<body><main class="wrap"><header><div class="logo">VideoLink</div><p>Abre y comparte tus videos desde un solo lugar.</p></header><section class="panel"><label for="url">Pega el enlace del video</label><input id="url" type="url" placeholder="https://..." autocomplete="url"><div><button id="open">Ver video</button><button class="secondary" id="copy">Copiar enlace</button><button class="secondary" id="clear">Limpiar</button></div><div id="status" role="status"></div><div class="viewer" id="viewer"></div><p class="note">VideoLink no añade anuncios propios. Algunos sitios pueden mostrar sus propios anuncios y restricciones. Los enlaces de otras páginas se abren en el sitio original; no se eliminan anuncios ni se evitan controles de las plataformas.</p></section></main>
<script>
const input=document.getElementById('url'),viewer=document.getElementById('viewer'),status=document.getElementById('status');
function show(){let raw=input.value.trim();if(!raw){status.textContent='Pega primero un enlace.';return}let u;try{u=new URL(raw)}catch{status.textContent='Ese enlace no parece válido.';return}viewer.innerHTML='';viewer.style.display='block';let host=u.hostname.replace(/^www\./,'');let id='';if(host==='youtu.be')id=u.pathname.slice(1);else if(host.endsWith('youtube.com'))id=u.searchParams.get('v')||u.pathname.match(/\/(?:shorts|embed)\/([^/?]+)/)?.[1];if(id){let f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id);f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';f.allowFullscreen=true;viewer.append(f);status.textContent='Video de YouTube. La plataforma puede mostrar anuncios.';return}if(host.endsWith('vimeo.com')){id=u.pathname.split('/').filter(Boolean).pop();let f=document.createElement('iframe');f.src='https://player.vimeo.com/video/'+encodeURIComponent(id);f.allow='autoplay; fullscreen; picture-in-picture';f.allowFullscreen=true;viewer.append(f);status.textContent='Video de Vimeo.';return}if(host.endsWith('dailymotion.com')||host==='dai.ly'){id=host==='dai.ly'?u.pathname.slice(1):u.pathname.match(/video\/([^_/?]+)/)?.[1];if(id){let f=document.createElement('iframe');f.src='https://www.dailymotion.com/embed/video/'+encodeURIComponent(id);f.allowFullscreen=true;viewer.append(f);status.textContent='Video de Dailymotion.';return}}if(/\.(mp4|webm|ogv)(?:$|\?)/i.test(u.href)){let v=document.createElement('video');v.controls=true;v.src=u.href;viewer.append(v);status.textContent='Archivo de video directo.';return}status.textContent='Este sitio no permite insertar el video aquí. Se abrirá en su página original.';window.open(u.href,'_blank','noopener,noreferrer')}
document.getElementById('open').addEventListener('click',show);document.getElementById('copy').addEventListener('click',async()=>{if(!input.value.trim()){status.textContent='Pega primero un enlace.';return}try{await navigator.clipboard.writeText(input.value.trim());status.textContent='Enlace copiado.'}catch{status.textContent='No se pudo copiar automáticamente; selecciona y copia el enlace.'}});document.getElementById('clear').addEventListener('click',()=>{input.value='';viewer.innerHTML='';viewer.style.display='none';status.textContent=''});
</script></body></html>
